<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" style="background:#090d16; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
    <rect x="0" y="0" width="1600" height="70" fill="#0f172a"/>
    <text x="60" y="42" fill="#ffffff" font-size="20" font-weight="600" letter-spacing="0.5">INFRAHUB BRAND SYSTEM — TERRITORY B</text>
    <text x="480" y="42" fill="#38bdf8" font-size="14" font-family="'IBM Plex Mono', monospace" font-weight="500">THE ARCHITECTURAL MONOGRAM [PROPRIETARY IH]</text>
    <text x="1440" y="42" fill="#64748b" font-size="13" font-family="'IBM Plex Mono', monospace">BOARD 03 / 03</text>

    <!-- Panel 1: Hero Geometric Form (Mark 07) -->
    <g transform="translate(60, 110)">
      <rect width="480" height="460" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="32" y="44" fill="#94a3b8" font-size="12" font-family="'IBM Plex Mono', monospace" font-weight="600">01 / HERO GEOMETRIC FORM</text>
      
      <g transform="translate(140, 90) scale(3.5)" color="#ffffff">
        <!-- Interlocking IH Architectural Truss -->
        <path d="M14 10h8v44h-8V10zm14 0h8v18h10V10h8v44h-8V34H36v20h-8V10z" fill="#ffffff"/>
        <rect x="28" y="28" width="18" height="6" fill="#2563eb"/>
      </g>
      <text x="32" y="400" fill="#f8fafc" font-size="16" font-weight="600">The Structural IH Monogram</text>
      <text x="32" y="424" fill="#94a3b8" font-size="12">Monolithic architectural truss engineered from primary letterforms.</text>
    </g>

    <!-- Panel 2: Wordmark Integration -->
    <g transform="translate(570, 110)">
      <rect width="520" height="215" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="32" y="40" fill="#94a3b8" font-size="12" font-family="'IBM Plex Mono', monospace" font-weight="600">02 / HORIZONTAL SIGNATURE LOCKUP</text>
      
      <g transform="translate(36, 75)">
        <g transform="scale(1.1)">
          <path d="M14 10h8v44h-8V10zm14 0h8v18h10V10h8v44h-8V34H36v20h-8V10z" fill="#ffffff"/>
          <rect x="28" y="28" width="18" height="6" fill="#2563eb"/>
        </g>
        <text x="86" y="48" fill="#ffffff" font-size="40" font-weight="600" letter-spacing="-0.5">Infra<tspan fill="#38bdf8">Hub</tspan></text>
        <text x="250" y="48" fill="#64748b" font-size="18" font-weight="300" letter-spacing="2">|</text>
        <text x="268" y="46" fill="#38bdf8" font-size="12" font-family="'IBM Plex Mono', monospace" letter-spacing="1">INSTITUTIONAL</text>
      </g>
      <text x="32" y="185" fill="#64748b" font-size="11" font-family="'IBM Plex Mono', monospace">Perfect typographic kinship between monogram stems and wordmark uprights.</text>
    </g>

    <!-- Panel 3: Favicon & Micro Scale -->
    <g transform="translate(1120, 110)">
      <rect width="420" height="215" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="32" y="40" fill="#94a3b8" font-size="12" font-family="'IBM Plex Mono', monospace" font-weight="600">03 / SCALE &amp; CONTRAST GATES</text>
      
      <rect x="32" y="65" width="160" height="34" rx="4" fill="#1e293b"/>
      <g transform="translate(42, 74) scale(0.25)">
        <path d="M14 10h8v44h-8V10zm14 0h8v18h10V10h8v44h-8V34H36v20h-8V10z" fill="#38bdf8"/>
      </g>
      <text x="64" y="86" fill="#f8fafc" font-size="11">InfraHub | 16px</text>

      <rect x="210" y="65" width="175" height="120" rx="4" fill="#f8fafc"/>
      <text x="224" y="88" fill="#0f172a" font-size="10" font-family="'IBM Plex Mono', monospace" font-weight="600">HIGH-CONTRAST REVERSE</text>
      <g transform="translate(265, 105) scale(0.9)">
        <path d="M14 10h8v44h-8V10zm14 0h8v18h10V10h8v44h-8V34H36v20h-8V10z" fill="#0f172a"/>
      </g>
      
      <text x="32" y="185" fill="#10b981" font-size="11" font-family="'IBM Plex Mono', monospace">✓ Maximum optical density; highest readability at micro scale</text>
    </g>

    <!-- Panel 4: Hardware Asset Tag -->
    <g transform="translate(570, 350)">
      <rect width="520" height="220" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="32" y="36" fill="#94a3b8" font-size="12" font-family="'IBM Plex Mono', monospace" font-weight="600">04 / HARDWARE ASSET COMPLIANCE TAG</text>
      
      <g transform="translate(32, 55)">
        <rect width="456" height="135" rx="4" fill="#e2e8f0" stroke="#cbd5e1"/>
        <text x="20" y="30" fill="#0f172a" font-size="14" font-weight="700">INFRASTRUCTURE HARNESS VERIFIED</text>
        <text x="20" y="48" fill="#64748b" font-size="10" font-family="'IBM Plex Mono', monospace">SERIAL: IH-SDR-8894-LHR // LOT 2026-Q3</text>
        <line x1="20" y1="58" x2="436" y2="58" stroke="#94a3b8" stroke-width="0.5"/>
        <text x="20" y="80" fill="#334155" font-size="11">Architecture: Supermicro High-Density Blade // 100G Mellanox CX6</text>
        <text x="20" y="100" fill="#334155" font-size="11">Testing Protocol: Telestar-Verified Resilience Audit (Pass)</text>
        <g transform="translate(380, 20) scale(0.8)">
          <path d="M14 10h8v44h-8V10zm14 0h8v18h10V10h8v44h-8V34H36v20h-8V10z" fill="#0f172a"/>
        </g>
      </g>
    </g>

    <!-- Panel 5: Navigation Application -->
    <g transform="translate(1120, 350)">
      <rect width="420" height="220" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="32" y="36" fill="#94a3b8" font-size="12" font-family="'IBM Plex Mono', monospace" font-weight="600">05 / DESKTOP HEADER BAR APPLICATION</text>
      
      <g transform="translate(32, 65)">
        <rect width="356" height="60" rx="4" fill="#0b1120" stroke="#1e293b"/>
        <g transform="translate(16, 16) scale(0.55)">
          <path d="M14 10h8v44h-8V10zm14 0h8v18h10V10h8v44h-8V34H36v20h-8V10z" fill="#ffffff"/>
        </g>
        <text x="48" y="36" fill="#ffffff" font-size="16" font-weight="600">Infra<tspan fill="#38bdf8">Hub</tspan></text>
        <text x="170" y="35" fill="#94a3b8" font-size="11">Offers</text>
        <text x="220" y="35" fill="#94a3b8" font-size="11">Partners</text>
        <rect x="280" y="20" width="60" height="24" rx="3" fill="#2563eb"/>
        <text x="290" y="36" fill="#ffffff" font-size="10" font-weight="600">Inquire</text>
      </g>
    </g>

    <!-- Panel 6: Strategic Evaluation Summary -->
    <g transform="translate(60, 600)">
      <rect width="1480" height="340" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="40" y="44" fill="#94a3b8" font-size="12" font-family="'IBM Plex Mono', monospace" font-weight="600">06 / STRATEGIC SUITABILITY &amp; SYSTEM EVALUATION</text>
      
      <g transform="translate(40, 70)">
        <text x="0" y="24" fill="#38bdf8" font-size="18" font-weight="600">Key Strengths &amp; Ownability</text>
        <text x="0" y="55" fill="#cbd5e1" font-size="14">
          • Permanently anchors brand recognition by locking the name into the visual symbol.
        </text>
        <text x="0" y="82" fill="#cbd5e1" font-size="14">
          • Highest structural permanence; flawless performance on metal stamping and hardware plates.
        </text>
        <text x="0" y="109" fill="#cbd5e1" font-size="14">
          • Highest optical density at 16px—virtually impossible to render illegibly.
        </text>
      </g>

      <g transform="translate(520, 70)">
        <text x="0" y="24" fill="#f59e0b" font-size="18" font-weight="600">Risks &amp; Calibration Rules</text>
        <text x="0" y="55" fill="#cbd5e1" font-size="14">
          • Less inherently focused on the "hidden dependency" storytelling than Territories A and D.
        </text>
        <text x="0" y="82" fill="#cbd5e1" font-size="14">
          • Requires precise negative-space proportioning so the 'I' does not separate from the 'H'.
        </text>
      </g>

      <g transform="translate(1040, 70)">
        <text x="0" y="24" fill="#10b981" font-size="18" font-weight="600">16-Dimension Master Score</text>
        <text x="0" y="70" fill="#ffffff" font-size="54" font-weight="700">70<tspan fill="#64748b" font-size="28">/80</tspan></text>
        <text x="0" y="102" fill="#38bdf8" font-size="14" font-weight="600">87.5% — INSTITUTIONAL ANCHOR</text>
        <text x="0" y="130" fill="#94a3b8" font-size="12">Recommended as Alternate Finalist / Hardware Sourcing Signature.</text>
      </g>
    </g>
  </svg>