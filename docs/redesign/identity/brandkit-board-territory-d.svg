<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" style="background:#090d16; font-family:'IBM Plex Sans', -apple-system, sans-serif;">
    <!-- Canvas Header -->
    <rect x="0" y="0" width="1600" height="70" fill="#0f172a"/>
    <text x="60" y="42" fill="#ffffff" font-size="20" font-weight="600" letter-spacing="0.5">INFRAHUB BRAND SYSTEM — TERRITORY D</text>
    <text x="480" y="42" fill="#f59e0b" font-size="14" font-family="'IBM Plex Mono', monospace" font-weight="500">THE STRATUM REVEAL [LOGICAL VS PHYSICAL LAYERS]</text>
    <text x="1440" y="42" fill="#64748b" font-size="13" font-family="'IBM Plex Mono', monospace">BOARD 02 / 03</text>

    <!-- Panel 1: Hero Geometric Form (Mark 19) -->
    <g transform="translate(60, 110)">
      <rect width="480" height="460" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="32" y="44" fill="#94a3b8" font-size="12" font-family="'IBM Plex Mono', monospace" font-weight="600">01 / HERO GEOMETRIC FORM</text>
      
      <g transform="translate(140, 100) scale(3.5)">
        <!-- Upper logical stratum (Shifted right) -->
        <path d="M14 16h26l-8 16H14V16z" fill="#f8fafc"/>
        <!-- Lower physical stratum (Offset & exposed) -->
        <path d="M26 36h26v16H32l-6-16z" fill="#38bdf8"/>
        <!-- Reveal plane accent line -->
        <line x1="14" y1="34" x2="52" y2="34" stroke="#f59e0b" stroke-width="1.5"/>
      </g>
      <text x="32" y="400" fill="#f8fafc" font-size="16" font-weight="600">The Stratum Reveal</text>
      <text x="32" y="424" fill="#94a3b8" font-size="12">Surface service abstraction shifted to expose underlying physical infrastructure.</text>
    </g>

    <!-- Panel 2: Signature Horizontal Lockup -->
    <g transform="translate(570, 110)">
      <rect width="520" height="215" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="32" y="40" fill="#94a3b8" font-size="12" font-family="'IBM Plex Mono', monospace" font-weight="600">02 / HORIZONTAL SIGNATURE LOCKUP</text>
      
      <g transform="translate(36, 75)">
        <g transform="scale(1.2)">
          <path d="M14 16h26l-8 16H14V16z" fill="#f8fafc"/>
          <path d="M26 36h26v16H32l-6-16z" fill="#38bdf8"/>
          <line x1="14" y1="34" x2="52" y2="34" stroke="#f59e0b" stroke-width="1.5"/>
        </g>
        <text x="96" y="48" fill="#ffffff" font-size="40" font-weight="600" letter-spacing="-0.5">Infra<tspan fill="#38bdf8">Hub</tspan></text>
        <text x="260" y="48" fill="#64748b" font-size="18" font-weight="300" letter-spacing="2">|</text>
        <text x="278" y="46" fill="#f59e0b" font-size="12" font-family="'IBM Plex Mono', monospace" letter-spacing="1">STRATA DYNAMICS</text>
      </g>
      <text x="32" y="185" fill="#64748b" font-size="11" font-family="'IBM Plex Mono', monospace">Dual-strata mark aligned with custom sans letterforms; 45-degree angle echoing italic dynamics.</text>
    </g>

    <!-- Panel 3: Scale & Reverse Testing -->
    <g transform="translate(1120, 110)">
      <rect width="420" height="215" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="32" y="40" fill="#94a3b8" font-size="12" font-family="'IBM Plex Mono', monospace" font-weight="600">03 / SCALE &amp; CONTRAST GATES</text>
      
      <rect x="32" y="65" width="160" height="34" rx="4" fill="#1e293b"/>
      <g transform="translate(42, 74) scale(0.25)">
        <path d="M14 16h26l-8 16H14V16z" fill="#ffffff"/>
        <path d="M26 36h26v16H32l-6-16z" fill="#38bdf8"/>
      </g>
      <text x="64" y="86" fill="#f8fafc" font-size="11">InfraHub | 16px</text>

      <rect x="210" y="65" width="175" height="120" rx="4" fill="#f8fafc"/>
      <text x="224" y="88" fill="#0f172a" font-size="10" font-family="'IBM Plex Mono', monospace" font-weight="600">HIGH-CONTRAST MONO</text>
      <g transform="translate(265, 105) scale(0.9)">
        <path d="M14 16h26l-8 16H14V16z" fill="#0f172a"/>
        <path d="M26 36h26v16H32l-6-16z" fill="#475569"/>
      </g>
      
      <text x="32" y="185" fill="#10b981" font-size="11" font-family="'IBM Plex Mono', monospace">✓ Distinct offset silhouette ensures 16px recognition</text>
    </g>

    <!-- Panel 4: Interactive Web Reveal Component -->
    <g transform="translate(570, 350)">
      <rect width="520" height="220" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="32" y="36" fill="#94a3b8" font-size="12" font-family="'IBM Plex Mono', monospace" font-weight="600">04 / WEB REVEAL BEHAVIOR (HOVER STATE)</text>
      
      <g transform="translate(32, 55)">
        <rect width="456" height="135" rx="4" fill="#0b1120" stroke="#1e293b"/>
        <text x="16" y="28" fill="#cbd5e1" font-size="12" font-weight="600">LOGICAL OFFER: 100G TRANSIT SLICE</text>
        <text x="16" y="48" fill="#94a3b8" font-size="11">Catalogue view: Tier-1 IP Transit (London Interlink)</text>
        
        <!-- Underlying Physical Drawer (revealed on hover) -->
        <rect x="16" y="65" width="424" height="55" rx="2" fill="#1e293b" stroke="#38bdf8" stroke-width="1"/>
        <text x="28" y="86" fill="#38bdf8" font-size="11" font-family="'IBM Plex Mono', monospace" font-weight="600">INFRASTRUCTURE REALITY INSPECTION:</text>
        <text x="28" y="104" fill="#cbd5e1" font-size="11">Fiber: Zayo dark core · BGP: AS1299 · Facility: Equinix LD8 · SLA: 99.99%</text>
      </g>
    </g>

    <!-- Panel 5: Audit Deck Cover -->
    <g transform="translate(1120, 350)">
      <rect width="420" height="220" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="32" y="36" fill="#94a3b8" font-size="12" font-family="'IBM Plex Mono', monospace" font-weight="600">05 / DOCUMENT COVER APPLICATION</text>
      
      <g transform="translate(32, 55)">
        <rect width="356" height="135" rx="4" fill="#f8fafc"/>
        <line x1="20" y1="20" x2="336" y2="20" stroke="#0f172a" stroke-width="2"/>
        <text x="20" y="46" fill="#0f172a" font-size="16" font-weight="700">TECHNICAL QUALIFICATION MEMO</text>
        <text x="20" y="66" fill="#64748b" font-size="11" font-family="'IBM Plex Mono', monospace">EVALUATION SUMMARY &amp; SPECIFICATION</text>
        <text x="20" y="115" fill="#0f172a" font-size="12" font-weight="600">InfraHub Advisory</text>
        
        <!-- Geometric Accent -->
        <g transform="translate(290, 85) scale(0.5)">
          <path d="M14 16h26l-8 16H14V16z" fill="#0f172a"/>
          <path d="M26 36h26v16H32l-6-16z" fill="#2563eb"/>
        </g>
      </g>
    </g>

    <!-- Panel 6: Strategic Evaluation Summary -->
    <g transform="translate(60, 600)">
      <rect width="1480" height="340" rx="8" fill="#0f172a" stroke="#1e293b" stroke-width="1"/>
      <text x="40" y="44" fill="#94a3b8" font-size="12" font-family="'IBM Plex Mono', monospace" font-weight="600">06 / STRATEGIC SUITABILITY &amp; SYSTEM EVALUATION</text>
      
      <g transform="translate(40, 70)">
        <text x="0" y="24" fill="#38bdf8" font-size="18" font-weight="600">Key Strengths &amp; Ownability</text>
        <text x="0" y="55" fill="#cbd5e1" font-size="14">
          • Supreme motion storytelling champion: perfect translation into scroll-driven inspection.
        </text>
        <text x="0" y="82" fill="#cbd5e1" font-size="14">
          • Visually dynamic 45° planar offset creates high optical energy without needing 3D.
        </text>
        <text x="0" y="109" fill="#cbd5e1" font-size="14">
          • Translates seamlessly into digital UI cards, split drawers, and comparison tables.
        </text>
      </g>

      <g transform="translate(520, 70)">
        <text x="0" y="24" fill="#f59e0b" font-size="18" font-weight="600">Risks &amp; Calibration Rules</text>
        <text x="0" y="55" fill="#cbd5e1" font-size="14">
          • Must be kept strictly 2D flat; avoid isometric pseudo-3D shading to prevent looking like crypto.
        </text>
        <text x="0" y="82" fill="#cbd5e1" font-size="14">
          • Ensure the offset distance is calibrated so the two segments don't read as disconnected blocks.
        </text>
      </g>

      <g transform="translate(1040, 70)">
        <text x="0" y="24" fill="#10b981" font-size="18" font-weight="600">16-Dimension Master Score</text>
        <text x="0" y="70" fill="#ffffff" font-size="54" font-weight="700">73<tspan fill="#64748b" font-size="28">/80</tspan></text>
        <text x="0" y="102" fill="#38bdf8" font-size="14" font-weight="600">91.3% — TOP FINALIST</text>
        <text x="0" y="130" fill="#94a3b8" font-size="12">Recommended as Alternate Winner / Motion Driver for Phase 4.</text>
      </g>
    </g>
  </svg>